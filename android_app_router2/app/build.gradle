plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'org.edgeslm.demo'
    compileSdk 34
    // NDK は gradle.properties で固定（ZipDepth と同一）。新しい版に上げない。
    ndkVersion project.property('ndk.version')

    defaultConfig {
        // ★EdgeSLM_AndroidGemma4 用の別アプリ（2026-09-20）。同僚向けのデモ（org.edgeslm.demo）と端末で共存し、
        //   プロセスも別（NPU の上限もプロセスごと）。namespace（Kotlin のパッケージ・JNI の関数名）は変えない
        // ★判定デモ（EdgeSLM_AndroidGemma4Prune P24・2026-10-05）: お試しアプリ（gemma4prune。android_app_prune/）の複製で、別のアプリとして入る（置き場も別）
        // ★判定デモ v2（P36・2026-10-14）: 判定デモ（android_app_router/）の複製。規則 P31・引数 P35・ヘッド 1,656 行に替えた。別のアプリとして入る（置き場も別。P24 のアプリはそのまま）
        applicationId 'org.edgeslm.gemma4router2'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.2-gemma4router2'
        ndk {
            // 対象端末は arm64 のみ。他 ABI はビルド時間と APK サイズの無駄。
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                // nlohmann/json と std::string を使うため STL が必要。
                // 単一のネイティブライブラリしか持たないので static で十分（余計な .so を増やさない）。
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            // ★C-6（要件定義書 3.4節）
            // FastRPC は V68 skeleton に「通常のファイルシステムパス」を要求する。
            // これを true にするとマニフェストに extractNativeLibs="true" が入り、
            // インストール時に .so が実ファイルとして展開される。
            // false（AGP の現代の既定）だと APK から直接 mmap されパスが存在しなくなり、
            // FastRPC が skeleton を開けない。
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // ONNX Runtime 1.27.0（QNN EP 入り）。
    // v0.1 では ZipDepth 同梱物をそのまま使う＝「持ち込むのは自分のコードだけ」にして
    // 失敗時の切り分けを runner 側に限定する（基本設計③ 8.2節）。
    // jniLibs の QNN ランタイム（QAIRT 2.48 セット）と版を揃えること（FR-12）。
    // ★P24: 同じ AAR の Java の口（ai.onnxruntime）も使う（日本語 BERT を CPU で動かす。BertScorer.java）。新しい依存は足していない
    implementation files('libs/onnxruntime-android-qnn-1.27.0.aar')
}
